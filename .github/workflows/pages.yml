# Publishes the white paper to GitHub Pages: tools/paper-html.py renders
# docs/Intent to Metal.md, and the page is deployed alone as index.html.
name: Paper on Pages

on:
  push:
    branches: [master]
    paths: ['docs/Intent to Metal.md', 'tools/paper-html.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render the paper
        run: |
          python tools/paper-html.py
          mkdir -p _site
          cp "docs/Intent to Metal.html" _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
