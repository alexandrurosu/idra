# Intent for the cache: memcached's text protocol on bare Arm, sized from a declared workload.

[system]
name = "cache"
summary = "A memcached-compatible cache on TCP port 11211 of 10.0.2.15, on bare Arm: the Phase 4 benchmark target."

# The workload, declared. Size classes and their item counts are derived from it at build time:
# one class per band, holding items whose key + value + 2 bytes fit the band. A workload that
# differs from this declaration still works; its classes fill sooner and evict more, and the
# telemetry that shows it is the input for the next regeneration.
[memory]
data_bytes = 67108864            # item memory on the QEMU target (64 MiB)
connections = 128
band = [
  { max_bytes = 64,      share = 0.40 },
  { max_bytes = 128,     share = 0.20 },
  { max_bytes = 256,     share = 0.15 },
  { max_bytes = 512,     share = 0.10 },
  { max_bytes = 1024,    share = 0.06 },
  { max_bytes = 2048,    share = 0.04 },
  { max_bytes = 4096,    share = 0.025 },
  { max_bytes = 16384,   share = 0.015 },
  { max_bytes = 65536,   share = 0.007 },
  { max_bytes = 262144,  share = 0.0025 },
  { max_bytes = 1048828, share = 0.0005 },   # a 1 MiB value with a 250-byte key
]

[[clause]]
id = "C-1"
text = "On TCP port 11211 the cache speaks memcached's text protocol: set, add, replace, get (up to 14 keys), delete, version and quit, with memcached's exact replies, and stats with this cache's own counters (C-9). Keys may be up to 250 bytes and values up to 1,048,576 bytes. Within these limits, and while nothing is evicted, every reply matches what memcached 1.6 sends for the same command stream."
formal = { kind = "test", property = "matches_real_memcached" }

[[clause]]
id = "C-2"
text = "add stores only an absent key and replace only a present one; an item set to expire after N seconds is gone N seconds later; a negative expiry stores an item that is already expired. Absolute (Unix-time) expiry is refused, since this machine has no wall clock."
formal = { kind = "test", property = "memcached_semantics" }

[[clause]]
id = "C-3"
text = "A data block of any size may arrive in any number of segments; it is written straight into the item's memory as it arrives. A command memcached would refuse without reading its data block is refused the same way; one refused after it is parsed (too large, or no memory) gets memcached's reply and its data block is swallowed, not read as commands."
formal = { kind = "test", property = "memcached_framing" }

[[clause]]
id = "C-4"
text = "Memory is divided into the size classes the workload declaration gives. When a class is full, its zombies are tried first: a hand of their own walks up to 32 slots and frees the first of at most 2 zombies no reply still refers to. Only if none is freed is an item of that class evicted to make room, chosen by CLOCK (second chance): an item read or written since the hand last passed is passed over once. Expired items go first; in the second half of a sweep any linked item may go. A sweep looks at no more than 32 slots and checks at most 2 zombies, so a set fails with SERVER_ERROR out of memory storing object only if those find nothing to free (for example, a small class whose every slot is a reply still in flight). A bucket of the table holds no two items with the same key hash and length: storing one evicts the other."
formal = { kind = "test", property = "eviction" }

[[clause]]
id = "C-5"
text = "No item's memory is reused while a connection is still sending it or still receiving into it: an item that is deleted, replaced or evicted while a reply still refers to it is kept until no reply does. No item is read after it is freed or freed twice, every table cell names a linked item that names the cell back, and every reference a reply or a pending set holds names a live item. On EC2 a large value is sent from the item's own memory, which the network card reads after the frame is queued: such an item is also kept until the card has reported every frame that reads it sent, and every transmit descriptor that reads an item names a live one. On several cores, a core that may still send an item, or is filling it, pins it (writing its pin only while holding the stripe of the item's shard); an item is freed only when no core pins it. A pin for sending goes unless its core renews it (each shard every 16 ms, for every item there its replies and descriptors still name); that unused pins go is argued, not proved."
formal = { kind = "proof", obligations = ["lifetime", "bounds", "invariant", "requires", "ensures"] }

[[clause]]
id = "C-6"
text = "Handling any frame takes at most 1,000,000 machine instructions, whatever the size of the values involved: a segment's data is copied once, into the item it belongs to or the connection's line buffer, and a set it completes is stored; requests are served by the main loop (C-8)."
formal = { kind = "cost", function = "handle_frame", max_instructions = 1000000, obligations = ["termination"] }

[[clause]]
id = "C-8"
text = "Serving one connection for one pass of the main loop (a retransmission, or one step of request work and the segments that answer it) takes at most 1,000,000 machine instructions. A step of request work is one command, or up to 4 keys of a multi-key get, or moving buffered bytes of a data block."
formal = { kind = "cost", function = "conn_tick", max_instructions = 1000000, obligations = ["termination"] }

[[clause]]
id = "C-9"
text = "The cache counts get hits and misses and, for each size class, the sets into it and the sets that found it full, and reports them, with each class's item size and capacity, to the stats command. It also keeps a histogram of the sizes stored (key + value + 2, four buckets per power of two) and clock time spent in each part of its main loop. These counts are the input for regenerating the workload declaration, its band sizes as well as their shares (tools/regen.py, which can also watch for drift and propose a new declaration); a regenerated declaration takes effect only when a human builds with it."
formal = { kind = "test", property = "telemetry" }

[[clause]]
id = "C-7"
text = "Arithmetic never overflows, divides by zero or shifts out of range; every store fits its field."
formal = { kind = "proof", obligations = ["overflow", "division", "shift", "width"] }

[[clause]]
id = "S-1"
text = "The cache runs on every core it is built for (IDRA_CORES; the instance's two by default). Each core owns its connections and one queue pair of the network card, which spreads flows over the cores' receive queues (RSS). The items, the table and their bookkeeping are shared and split by key into shards (eight with several cores), each guarded by its own stripe of one lock: a shard is read or written only while its stripe is held, and a core holds one stripe at a time. Whatever a core holds outside the lock is its own: the build proves that everything that runs while several cores run writes only its core's own memory, memory a stripe it holds guards, or a device's. A stripe's invariant (its shard's shape, and what every core's pins promise for its items) holds whenever it is given back. Waiting for the lock is not bounded: the cost plane counts one core's instructions, not time spent waiting for the other (docs/LEDGER.md #19)."
formal = { kind = "proof", obligations = ["race"] }

[[clause]]
id = "N-4"
text = "The network driver never reads a receive buffer while the device owns it, never writes a transmit buffer the device has not returned, never touches a register outside the device's window, and never uses an index, id or length the device supplies without checking it."
formal = { kind = "proof", obligations = ["device"] }

[[clause]]
id = "N-8"
text = "The program touches nothing but the network device, the serial port, the CPU clock, the tick (N-11), starting the other cores (S-1), its own code where a dynamic boundary is switched (N-12), power control and the firmware it boots from; checksums and key hashing touch nothing at all."
formal = { kind = "proof", obligations = ["effects"], allowed = ["virtio.mmio", "ena.mmio", "pcie.config", "net.bind", "uart.io", "cpu.clock", "cpu.tick", "cpu.start", "code.patch", "power.off", "cpu.diag", "firmware.call", "firmware.tables", "board.config"], pure = ["csum_rx", "csum_reply", "tcsum_rx", "tcsum_reply", "key_hash"], deny = { main = ["board.config"], handle_frame = ["board.config"] } }

[[clause]]
id = "T-1"
text = "ARP, ping and TCP behave as in the network store (N-2, N-3, N-5, T-2, T-3, T-5): bad checksums are ignored, segments for no connection get a reset, unacknowledged data is retransmitted with a timeout doubling to 4 seconds, and a peer silent through 6 retransmissions is dropped. A peer that keeps answering with its window shut is not silent: it is probed with one byte each time the timer runs out, and kept. A peer's SYN options are honoured: its MSS bounds the segments sent to it (on EC2 up to 8,960 bytes, a jumbo frame), and its window scale, which the cache accepts with a shift of 0 for its own windows. Received data is acknowledged with the reply it causes, or after two full segments, or within 0.5 ms."
formal = { kind = "test", property = "tcp_behaviour" }

[[clause]]
id = "T-4"
text = "At most 128 connections exist at once on each core (two cores: 256); a connection's state is only touched while it is open, and closing it frees it exactly once, along with any half-received item and every reference its replies held."
formal = { kind = "proof", obligations = ["lifetime"] }

# Where this build runs on EC2: the VPC assigns the instance's private address.
[[clause]]
id = "N-9"
text = "On EC2, through the ENA driver, the network card computes the TCP and UDP checksums of outgoing segments: the image writes the pseudo-header sum into the checksum field and asks the card for the rest (partial offload). This is an assumption about the card, not a proof; a wrong checksum would be dropped by the peer, which the tests against real clients would show. Incoming checksums are still verified by the image (this card offers no receive offload). The pure branch keeps the checksum in the image."
formal = { kind = "test", property = "peers_accept_offloaded_checksums" }

[[clause]]
id = "N-10"
text = "On master, a received TCP segment's payload and checksum are read in its receive buffer, where the card put it, not from a copy: the image assumes the card does not write a buffer between handing it over and the driver handing it back (as the ownership protocol says it will not). The headers are copied and checked as before, every read stays inside the buffer the driver holds (proved, N-4), and nothing proved depends on the bytes read. The pure branch keeps the copy."
formal = { kind = "test", property = "data_read_in_place_matches" }

[[clause]]
id = "N-11"
text = "One interrupt is let in: the CPU's virtual timer, every 1 ms, through the interrupt controller (GICv3). Its handler only counts it (TICKS) and re-arms the timer; the main loop runs the connection timers and polls the console on each count; the other cores' loops read the same count. The handler writes nothing else, nothing else writes TICKS, and every read of TICKS assumes nothing about its value, so every other proof holds wherever the interrupt arrives. The entry stub that saves and restores the interrupted registers is hand-written and trusted, like the boot code. Without a GICv3 the loop counts passes instead."
formal = { kind = "proof", obligations = ["interrupt"], handler = "tick", writes = ["TICKS"], effects = ["cpu.tick"] }

[[clause]]
id = "N-12"
text = "Everything the cache does only to observe itself sits behind one of three dynamic boundaries: counters (get hits and misses, sets and full classes per class), sizes (the histogram of item sizes) and profile (the clock time spent in each part of the main loop). Each can be switched on and off while the cache runs. While a boundary is off, each of its sites is a single instruction that does nothing; switching it on rewrites those instructions into branches to the out-of-line code, and back. Every other guarantee holds for every setting of every boundary, at any moment: a site writes only its boundary's counters, allocates nothing, and leaves nothing behind that code outside the boundaries reads. Only the boot code, the serial console and the control port (N-13) switch boundaries. The routine that rewrites the sites is hand-written and trusted, like the boot code; the rewritten instructions are checked against LLVM like every other. On UEFI the firmware maps code read-only, so an image with dynamic boundaries asks it at boot to make its own code pages writable (and gives up that protection); if the firmware refuses, every boundary stays as booted and switching one answers ERROR. counters and sizes are on at boot, profile is off. On two cores each core keeps its own time profile, and a stats reply shows the profile of the core serving that connection; the counters and sizes are shared."
formal = { kind = "proof", obligations = ["boundary"], boundaries = [ { name = "counters", writes = ["TEL"] }, { name = "sizes", writes = ["SH"] }, { name = "profile", writes = ["TIM"] } ], switch = ["main", "serve0", "ctl_execute"] }

[[clause]]
id = "N-13"
text = "The boundaries are switched from the serial console (keys 1, 2, 3) or over TCP port 11212, which accepts connections only from the addresses listed under [control] for the board the image is built for (an address, an address/prefix, or a hostname resolved when the image is built). A connection from anywhere else gets a reset. On the control port each line is one command: on NAME, off NAME, status, quit; anything else gets ERROR. Port 11211 is unchanged."
formal = { kind = "test", property = "control_plane" }

[control]
port = 11212
boot_on = ["counters", "sizes"]
# who may connect to the control port: QEMU's user network shows the host as 10.0.2.2; on
# EC2 the bench helper (idra-helper), which also drives the tests
allow = { "qemu-virt" = ["10.0.2.2"], uefi = ["172.31.7.144"] }

[deploy.uefi]
ip = "172.31.2.22"
# item memory on the EC2 target, a t4g.small (2 GiB): the declared bands and shares are
# the same as on QEMU, scaled to this; the rest of RAM is the firmware's and the image's
data_bytes = 805306368             # 768 MiB, allocated from the firmware at boot; with the table, records
                                   # and rings ~800 MB, inside the largest free block (972 MiB on a t4g.small)
