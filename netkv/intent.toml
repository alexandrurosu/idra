# Intent for the key-value store served over the network (virtio-net on QEMU).

[system]
name = "netkv"
summary = "The key-value store answering UDP datagrams on 10.0.2.15 port 7777, with ARP and ping, on bare Arm."

[[clause]]
id = "N-0"
text = "The store keeps K-6: every table cell is empty, a tombstone, or names a live entry that names it back. Driver functions that touch packet buffers state, in their contracts, who owns the buffer."
formal = { kind = "proof", obligations = ["requires", "ensures", "invariant"] }

[[clause]]
id = "N-1"
text = "A datagram to port 7777 carrying a store command is answered with exactly the text the console store would print for it, sent back to the sender's address and port."
formal = { kind = "test", property = "udp_matches_reference" }

[[clause]]
id = "N-2"
text = "ARP requests for 10.0.2.15 are answered with this machine's MAC; other ARP traffic is ignored."
formal = { kind = "test", property = "arp_matches_reference" }

[[clause]]
id = "N-3"
text = "Echo requests to 10.0.2.15 are answered with the same identifier, sequence and data, and valid checksums."
formal = { kind = "test", property = "icmp_matches_reference" }

[[clause]]
id = "N-4"
text = "The driver never reads a receive buffer while the device owns it, never writes a transmit buffer the device has not returned, never touches a register outside the device's window, and never uses an index, id or length the device supplies without checking it."
formal = { kind = "proof", obligations = ["bounds", "device", "lifetime", "width"] }

[[clause]]
id = "N-5"
text = "Frames not addressed to this machine, with a bad IPv4 header checksum, IP options, fragments, or inconsistent lengths, are dropped without a reply."
formal = { kind = "test", property = "malformed_dropped" }

[[clause]]
id = "N-6"
text = "Arithmetic never overflows, divides by zero or shifts out of range."
formal = { kind = "proof", obligations = ["overflow", "division", "shift"] }

[[clause]]
id = "N-7"
text = "Handling any frame, including a TCP segment that completes a request (up to a 14-key memcached get), takes at most 1,000,000 machine instructions, not counting time spent waiting for the serial port. (Revised from 600,000 when memcached's multi-key get was added.)"
formal = { kind = "cost", function = "handle_frame", max_instructions = 1000000, obligations = ["termination"] }

[[clause]]
id = "N-8"
text = "The program touches nothing but the network device, the serial port, power control and the firmware it boots from; checksums and key hashing touch nothing at all."
formal = { kind = "proof", obligations = ["effects"], allowed = ["virtio.mmio", "uart.io", "cpu.clock", "power.off", "cpu.diag", "firmware.call", "firmware.tables", "board.config"], pure = ["csum_rx", "csum_reply", "tcsum_rx", "tcsum_reply", "hash", "lookup", "key_eq"], deny = { main = ["board.config"], handle_frame = ["board.config"] } }

[[clause]]
id = "T-1"
text = "Over TCP on port 7777, each request line is answered with exactly the text the console store would print, in order, on the same connection; requests may be pipelined."
formal = { kind = "test", property = "tcp_matches_reference" }

[[clause]]
id = "T-2"
text = "Segments with a bad checksum are ignored; every segment sent carries a valid checksum."
formal = { kind = "test", property = "tcp_checksums" }

[[clause]]
id = "T-3"
text = "A segment that belongs to no connection is answered with a reset, never with data."
formal = { kind = "test", property = "tcp_reset" }

[[clause]]
id = "T-4"
text = "At most 8 connections exist at once; a connection's state and buffers are only ever touched while it is open, and closing frees it exactly once."
formal = { kind = "proof", obligations = ["lifetime"] }

[[clause]]
id = "T-5"
text = "Unacknowledged data is retransmitted after a timeout that doubles each time, up to 4 seconds; after 6 unanswered retransmissions the connection is dropped."
formal = { kind = "test", property = "tcp_retransmit" }

[[clause]]
id = "M-1"
text = "On TCP port 11211 the store speaks memcached's text protocol: set, add, replace, get (up to 14 keys), delete, version and quit, with memcached's exact replies. Within this build's limits, every reply matches what memcached 1.6 sends for the same command stream."
formal = { kind = "test", property = "matches_real_memcached" }

[[clause]]
id = "M-2"
text = "add stores only an absent key and replace only a present one; an item set to expire after N seconds is gone N seconds later; a negative expiry stores an item that is already expired. Absolute (Unix-time) expiry is refused, since this machine has no wall clock."
formal = { kind = "test", property = "memcached_semantics" }

[[clause]]
id = "M-3"
text = "A storage command's data block may arrive in any number of segments. A command memcached would refuse without reading its data block is refused the same way; one too large for this build is refused with memcached's 'object too large' reply and its data block is swallowed, not read as commands."
formal = { kind = "test", property = "memcached_framing" }

[[clause]]
id = "M-4"
text = "Limits of this build: keys up to 16 bytes, values up to 64, 48 items, requests up to 200 bytes. A full store answers SERVER_ERROR out of memory storing object (eviction comes with the cache's larger build)."
formal = { kind = "proof", obligations = ["lifetime", "bounds"] }
